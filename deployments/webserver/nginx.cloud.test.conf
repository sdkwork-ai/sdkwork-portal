# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/portal/webserver.pid;
error_log /var/log/sdkwork/portal/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name portal-test.sdkwork.com portal-test.birdcoder.com portal-test.dtupay.com portal-test.sdkwork.cn portal-test.birdcoder.cn portal-test.dtupay.cn portal-test.skubc.com portal-test.skubc.cn portal-test.zowalk.com portal-test.zowalk.cn portal-test.offer86.com portal-test.offer86.cn portal-test.86offer.com portal-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
