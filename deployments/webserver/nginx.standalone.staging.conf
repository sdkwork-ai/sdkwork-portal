# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/portal/webserver.pid;
error_log /var/log/sdkwork/portal/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18091;
    }
    server {
        listen 80;
        server_name portal-staging.sdkwork.com portal-staging.birdcoder.com portal-staging.dtupay.com portal-staging.sdkwork.cn portal-staging.birdcoder.cn portal-staging.dtupay.cn portal-staging.skubc.com portal-staging.skubc.cn portal-staging.zowalk.com portal-staging.zowalk.cn portal-staging.offer86.com portal-staging.offer86.cn portal-staging.86offer.com portal-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
