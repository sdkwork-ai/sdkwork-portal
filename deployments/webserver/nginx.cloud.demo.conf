# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/portal/webserver.pid;
error_log /var/log/sdkwork/portal/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name portal-demo.sdkwork.com portal-demo.birdcoder.com portal-demo.dtupay.com portal-demo.noaper.com portal-demo.sdkwork.cn portal-demo.birdcoder.cn portal-demo.dtupay.cn portal-demo.noaper.cn portal-demo.skubc.com portal-demo.skubc.cn portal-demo.zowalk.com portal-demo.zowalk.cn portal-demo.offer86.com portal-demo.offer86.cn portal-demo.86offer.com portal-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/portal/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
